<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mana Bazar - Farmer Ki Own Bazar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f5; color: #222; padding: 20px; }
    header { background-color: #1b5e20; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 28px; margin-bottom: 5px; }
    header p { font-size: 14px; color: #c8e6c9; }
    .container { max-width: 800px; margin: 0 auto; display: grid; gap: 20px; }
    .rates-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 5px solid #2e7d32; }
    .card h2 { font-size: 20px; margin-bottom: 8px; color: #1b5e20; }
    .price { font-size: 28px; font-weight: bold; color: #d32f2f; }
    .price.onion { color: #6a1b9a; }
    .updated { font-size: 12px; color: #666; margin-top: 6px; }
    .login-box { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .login-box h2 { margin-bottom: 16px; color: #1b5e20; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background-color: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1b5e20; }
    #status { margin-top: 12px; font-weight: bold; color: #1b5e20; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>MANA BAZAR</h1>
    <p>Farmer Ki Own Bazar — Live Market Rates</p>
  </header>

  <div class="container">
    <div class="rates-grid">
      <div class="card">
        <h2>🍅 Tomato Rate (టమాటా)</h2>
        <div class="price">₹28 / kg</div>
        <div class="updated">Mandi: Bowenpally / Gudimalkapur • Today</div>
      </div>

      <div class="card">
        <h2>🧅 Onion Rate (ఉల్లిపాయ)</h2>
        <div class="price onion">₹35 / kg</div>
        <div class="updated">Mandi: Malakpet • Today</div>
      </div>
    </div>

    <div class="login-box">
      <h2>👨‍🌾 Farmer Login</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="farmerName">Farmer Name (రైతు పేరు)</label>
          <input type="text" id="farmerName" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="mobile">Mobile Number (ఫోన్ నంబర్)</label>
          <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
        </div>
        <button type="submit">Login to Mana Bazar</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const name = document.getElementById('farmerName').value;
      document.getElementById('status').innerText = `Swagatham ${name}! Login Successful.`;
    }
  </script>

</body>
</html>
