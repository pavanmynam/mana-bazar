# Builds the Mee Bazar Android app on GitHub's servers (nothing to install on your computer).
# Runs on every push to main, or by hand: Actions tab -> "Android app" -> Run workflow.
# Output (Actions run page -> Artifacts):
#   mee-bazar-test-apk  : install directly on any Android phone for testing
#   mee-bazar-playstore : signed .aab for Play Console (only when the 4 signing secrets are set)
name: Android app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm install
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Build website
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Permissions (camera for scanner, location for nearby shops) and version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' "$M"
          grep -q "android.permission.CAMERA" "$M"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff5722' --splashBackgroundColor '#ff5722'

      - name: Copy website into the app
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mee-bazar-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed Play Store bundle (.aab)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: mee-bazar-playstore
          path: android/app/build/outputs/bundle/release/app-release.aab
